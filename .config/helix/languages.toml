# Keep language behavior close to the Neovim setup. Helix merges these entries
# with its built-in language definitions, so syntax, roots, and file types do
# not need to be repeated here.

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.pyright.config.python.analysis.inlayHints]
variableTypes = true
functionReturnTypes = true

[language-server.rust-analyzer]
command = "rust-analyzer"

[language-server.rust-analyzer.config.inlayHints]
bindingModeHints.enable = true
chainingHints.enable = true
closingBraceHints.enable = true
parameterHints.enable = true
typeHints.enable = true

[language-server.vtsls]
command = "vtsls"
args = ["--stdio"]

[language-server.vtsls.config.typescript.inlayHints]
parameterNames.enabled = "all"
parameterTypes.enabled = true
variableTypes.enabled = true
propertyDeclarationTypes.enabled = true
functionLikeReturnTypes.enabled = true
enumMemberValues.enabled = true

[language-server.vtsls.config.javascript.inlayHints]
parameterNames.enabled = "all"
parameterTypes.enabled = true
variableTypes.enabled = true
propertyDeclarationTypes.enabled = true
functionLikeReturnTypes.enabled = true
enumMemberValues.enabled = true

[language-server.roslyn-language-server]
command = "roslyn-language-server"
args = ["--stdio", "--autoLoadProjects"]
timeout = 60

[language-server.roslyn-language-server.config."csharp|symbol_search"]
dotnet_search_reference_assemblies = true

[language-server.roslyn-language-server.config."csharp|completion"]
dotnet_show_name_completion_suggestions = true
dotnet_show_completion_items_from_unimported_namespaces = true
dotnet_provide_regex_completions = true
dotnet_trigger_completion_in_argument_lists = true

[language-server.roslyn-language-server.config."csharp|inlay_hints"]
csharp_enable_inlay_hints_for_implicit_object_creation = true
csharp_enable_inlay_hints_for_implicit_variable_types = true

[[language]]
name = "c"
indent = { tab-width = 4, unit = "    " }
language-servers = ["clangd"]

[[language]]
name = "cpp"
indent = { tab-width = 4, unit = "    " }
language-servers = ["clangd"]

[[language]]
name = "c-sharp"
indent = { tab-width = 4, unit = "    " }
language-servers = ["roslyn-language-server"]
formatter = { command = "csharpier", args = ["format", "--write-stdout", "--stdin-path", "%{buffer_name}"] }
auto-format = true

